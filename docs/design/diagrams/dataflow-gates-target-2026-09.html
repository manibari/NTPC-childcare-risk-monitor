h="1540" height="58" rx="8" fill="#fff" stroke="#e5e9ee"/><text class="n" x="50" y="394" text-anchor="start">恆等式剔錯 BS / IS</text><text class="lg" x="360" y="394" text-anchor="start">OCR 誤讀 → 該頁科目設空，不進財務燈號</text><rect x="840" y="369" width="50" height="36" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/><text class="n" x="865" y="395" text-anchor="middle" fill="#52c41a">✓</text><text class="lg" x="920" y="394" text-anchor="start" fill="#6b7680">兩份報告同位置同錯（機率低）</text><rect x="30" y="424" width="1540" height="58" rx="8" fill="#fafcff" stroke="#e5e9ee"/><text class="n" x="50" y="460" text-anchor="start">匿名化白名單 API + Exporter</text><text class="lg" x="360" y="460" text-anchor="start">任何回應與匯出不含 actor_name / owner / operator 原文</text><rect x="840" y="435" width="50" height="36" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/><text class="n" x="865" y="461" text-anchor="middle" fill="#52c41a">✓</text><text class="lg" x="920" y="460" text-anchor="start" fill="#6b7680">園名本身含負責人姓名者（附設園）不在擋的範圍</text><rect x="30" y="490" width="1540" height="58" rx="8" fill="#fff" stroke="#e5e9ee"/><text class="n" x="50" y="526" text-anchor="start">來源失敗沿用舊快照</text><text class="lg" x="360" y="526" text-anchor="start">一站掛掉不停整條；資料品質頁標示</text><rect x="840" y="501" width="50" height="36" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/><text class="n" x="865" y="527" text-anchor="middle" fill="#52c41a">✓</text><text class="lg" x="920" y="526" text-anchor="start" fill="#6b7680">data_asof 不前進 → 觸發 stale 警示（刻意）</text><rect x="30" y="556" width="1540" height="58" rx="8" fill="#fafcff" stroke="#e5e9ee"/><text class="n" x="50" y="592" text-anchor="start">Approver AUC 降 >0.05</text><text class="lg" x="360" y="592" text-anchor="start">新版留 trained，不自動切換</text><rect x="840" y="567" width="50" height="36" rx="8" fill="#fffbe6" stroke="#d48806" stroke-width="2"/><text class="n" x="865" y="593" text-anchor="middle" fill="#d48806">◐</text><text class="lg" x="920" y="592" text-anchor="start" fill="#a35f00">只警示；demo 無登入，任何人可核准</text><rect x="30" y="622" width="1540" height="58" rx="8" fill="#fff" stroke="#e5e9ee"/><text class="n" x="50" y="658" text-anchor="start">連坐同名旗標</text><text class="lg" x="360" y="658" text-anchor="start">同名負責人標「待人工確認」</text><rect x="840" y="633" width="50" height="36" rx="8" fill="#fffbe6" stroke="#d48806" stroke-width="2"/><text class="n" x="865" y="659" text-anchor="middle" fill="#d48806">◐</text><text class="lg" x="920" y="658" text-anchor="start" fill="#a35f00">仍列入名單直到人排除；距離門檻未定 → §8-2</text><rect x="30" y="688" width="1540" height="58" rx="8" fill="#fafcff" stroke="#e5e9ee"/><text class="n" x="50" y="724" text-anchor="start">stale 警示（>90 天）</text><text class="lg" x="360" y="724" text-anchor="start">頁首警示色 + 資料截至日</text><rect x="840" y="699" width="50" height="36" rx="8" fill="#fffbe6" stroke="#d48806" stroke-width="2"/><text class="n" x="865" y="725" text-anchor="middle" fill="#d48806">◐</text><text class="lg" x="920" y="724" text-anchor="start" fill="#a35f00">不擋匯出，承辦仍可拿過期名單去排</text><rect x="30" y="754" width="1540" height="58" rx="8" fill="#fff" stroke="#e5e9ee"/><text class="n" x="50" y="790" text-anchor="start">feedback 表</text><text class="lg" x="360" y="790" text-anchor="start">承辦可申訴誤判</text><rect x="840" y="765" width="50" height="36" rx="8" fill="#fff2f0" stroke="#ff4d4f" stroke-width="2"/><text class="n" x="865" y="791" text-anchor="middle" fill="#ff4d4f">✗</text><text class="lg" x="920" y="790" text-anchor="start" fill="#a33">只收不用，沒有任何流程讀它（首版明知）→ §8-10</text><text class="lg" x="30" y="836" text-anchor="start">對照組：前六列真的擋得住。◐ 三列是 demo 階段的取捨，試辦前要補「人核准」與「距離門檻」；✗ 一列首版明知不用，列在這裡是為了不被忘掉。</text>
