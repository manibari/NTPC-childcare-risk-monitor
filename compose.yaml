name: watchdog
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the ECR image URI}
    restart: unless-stopped
    environment:
      WATCHDOG_DB: /app/data/watchdog.sqlite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      X_DEMO_TOKEN: ${X_DEMO_TOKEN:-}
    volumes:
      - watchdog-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8765/api/v1/health',timeout=5)); assert d['ok'] and d['db']"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "12020:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  watchdog-data:
