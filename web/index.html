<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>小小守護員 Smart Watchdog</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#fafafa;--surface:#fff;--surface-2:#f3f4f6;--border:#e5e7eb;--border-strong:#d1d5db;--text:#0a0a0a;--text-muted:#6b7280;--text-subtle:#9ca3af;--accent:#2d4a3e;--accent-soft:#5b7a6a;--accent-bg:#e8efea;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--g1:#d1ddd5;--g2:#8aa399;--g3:#2d4a3e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Geist","PingFang TC","Noto Sans TC",sans-serif}
.mono{font-family:"Geist Mono","PingFang TC",monospace;font-feature-settings:'tnum' 1}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand svg{width:18px;height:18px;color:var(--accent)}.brand b{font-weight:600;letter-spacing:-.02em;color:var(--accent)}
.brand small{display:block;font-family:"Geist Mono",monospace;font-size:10px;color:var(--text-muted);letter-spacing:.05em}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--text-muted);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--surface-2);color:var(--text)}.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav a svg{width:15px;height:15px}.nav .grp{font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);padding:14px 10px 6px;border-top:1px solid var(--border);margin-top:8px}
.nav .grp:first-child{border:0;margin:0;padding-top:0}
.side .foot{position:absolute;bottom:16px;left:12px;right:12px;font-size:11px;color:var(--text-subtle)}
main{padding:24px 32px 48px;max-width:1280px}
.crumb{font-size:12px;color:var(--text-muted);margin-bottom:6px}.crumb span{color:var(--text-subtle);margin:0 6px}
h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--text-muted);margin:0 0 18px;font-size:13px}
h3{font-size:18px;font-weight:500;letter-spacing:-.02em;margin:0}
.row{display:grid;gap:16px;margin-bottom:16px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c21{grid-template-columns:2fr 1fr}.c12{grid-template-columns:1fr 2fr}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px}.card-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}.card-b{padding:16px}
.kpi .lab{font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}.kpi .val{font-family:"Geist Mono",monospace;font-size:28px;font-weight:500;margin:2px 0;font-feature-settings:'tnum' 1}.kpi .d{font-size:12px;color:var(--text-muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:500}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}td.wrap{white-space:normal}tr:hover td{background:var(--surface-2)}.num{text-align:right;font-family:"Geist Mono",monospace;font-feature-settings:'tnum' 1}th.num{text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}.dot.h{background:var(--err)}.dot.m{background:var(--warn)}.dot.l{background:var(--text-muted)}.dot.n{background:var(--border-strong)}
.chip{display:inline-block;font-family:"Geist Mono",monospace;font-size:10px;padding:1px 6px;border:1px solid var(--border-strong);border-radius:2px;background:var(--surface);color:var(--text-muted)}.chip.opt{border-style:dashed}.chip.err{color:var(--err);border-color:#fecaca}
.btn{display:inline-flex;align-items:center;gap:6px;font:500 13px "Geist",sans-serif;padding:7px 12px;border-radius:4px;border:1px solid var(--border-strong);background:transparent;color:var(--text);cursor:pointer}.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.pri:hover{background:#1f3a30;color:#fff}.btn.ghost{border-color:transparent;color:var(--text-muted)}.btn svg{width:14px;height:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inp{font:13px "Geist",sans-serif;padding:6px 10px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);min-width:140px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.note{font-size:12px;color:var(--text-muted);padding:10px 16px;border-top:1px solid var(--border)}.warnbox{border-left:3px solid var(--warn);background:var(--surface);padding:10px 14px;font-size:13px;color:var(--text-muted);margin-bottom:16px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-muted)}
#map{height:460px;border-radius:0 0 6px 6px}.leaflet-container{font:inherit}
.screen{display:none}.screen.on{display:block}
svg.chart text{font-family:"Geist Mono",monospace;font-size:10px;fill:var(--text-subtle)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}.tl .d{font-family:"Geist Mono",monospace;color:var(--text-muted)}
.grid-s{display:grid;grid-template-columns:70px repeat(13,1fr);gap:3px;font-size:11px}.grid-s .hd{font-family:"Geist Mono",monospace;font-size:10px;color:var(--text-subtle);text-align:center}.grid-s .cell{height:34px;border:1px solid var(--border);border-radius:3px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:"Geist Mono",monospace;font-size:11px}
.grid-s .cell.f{background:var(--accent-bg);border-color:var(--accent-soft)}.grid-s .cell.p{outline:1.5px solid var(--accent)}.grid-s .cell.s{background:#fef3c7}
.drawer{position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .15s ease;z-index:1000}.drawer.open{transform:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.drawer .body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:92%;padding:10px 12px;border-radius:6px;font-size:13px}.msg.u{align-self:flex-end;background:var(--accent-bg)}.msg.a{align-self:flex-start;background:var(--surface-2)}.msg .tool{font-family:"Geist Mono",monospace;font-size:10px;color:var(--text-muted);display:block;margin-top:6px}
.drawer .ft{padding:12px 16px;border-top:1px solid var(--border)}.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.sugg .chip{cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,10,10,.35);display:none;align-items:center;justify-content:center;z-index:1100}.modal.open{display:flex}.modal .box{width:520px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.fab{position:fixed;right:24px;bottom:24px;z-index:900}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lamp{display:flex;gap:16px}.lamp>div{flex:1;padding:12px;border:1px solid var(--border);border-radius:6px}.lamp .t{font-size:12px;color:var(--text-muted)}.lamp .v{font-family:"Geist Mono",monospace;font-size:22px;margin:2px 0}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8"/><path d="M12 8c-4 0-7-3-7-7 4 0 7 3 7 7z"/><path d="M12 12c4 0 7-3 7-7-4 0-7 3-7 7z"/></svg><div><b>小小守護員</b><small>smart watchdog · 新北教保</small></div></div>
  <nav class="nav" id="nav">
    <div class="grp">承辦</div>
    <a href="#overview" data-s="overview">ICON_MAP 總覽</a>

    <a href="#season" data-s="season">ICON_CLIP 本季名單</a>
    <a href="#finance" data-s="finance">ICON_COIN 財務體檢</a>
    <div class="grp">維護</div>

  </nav>

<main id="main"></main>
</div>

<button class="btn pri fab" onclick="document.getElementById('drawer').classList.add('open')">ICON_CHAT 問資料</button>
<aside class="drawer" id="drawer" role="dialog" aria-label="問答">
  <div class="hd"><h3>問資料</h3><button class="btn ghost" onclick="document.getElementById('drawer').classList.remove('open')">關閉</button></div>
  <div class="body" id="chat"></div>
  <div class="ft"><div class="sugg" id="sugg"></div>
    <form class="tools" id="askform" onsubmit="return askSubmit(event)"><input class="inp" id="askq" style="flex:1" placeholder="只讀資料；不會寫入任何名單"><button class="btn pri" type="submit">送出</button></form>
    <div style="font-size:11px;color:var(--text-subtle);margin-top:6px" id="askstate"></div></div>
</aside>

<div class="modal" id="modal"><div class="box"><div class="card-h"><h3>匯出</h3><button class="btn ghost" onclick="document.getElementById('modal').classList.remove('open')">關閉</button></div>
 <div class="card-b" style="display:grid;gap:12px">
  <label>範圍 <select class="inp" id="exscope"><option value="season">本季名單（兩層）</option><option value="rankings">目前排名前 N</option><option value="schedule">本季行程</option></select></label>
  <label>格式 <select class="inp" id="exfmt"><option value="xlsx">Excel（.xlsx）</option><option value="csv">CSV</option></select></label>
  <label><input type="checkbox" checked disabled> 不含負責人／行為人姓名 — 不可關閉</label>
  <div class="note" style="border:0;padding:0">空名單時回 422「無資料」</div>
  <div class="tools" style="justify-content:flex-end"><button class="btn" onclick="document.getElementById('modal').classList.remove('open')">取消</button><a class="btn pri" id="exgo" href="#" target="_blank">ICON_DL 下載</a></div>
 </div></div></div>

<style>.clickable{cursor:pointer}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;z-index:1200;display:none}.skel{color:var(--text-muted);padding:24px}.errbox{border-left:3px solid var(--err);background:var(--surface);padding:12px 16px;margin-bottom:16px}.row>*{min-width:0}td.tt{max-width:240px;overflow:hidden;text-overflow:ellipsis}</style>
<div class="toast" id="toast"></div>
<script>
const I = {
 MAP:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>',
 LIST:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 SCHOOL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>',
 CAL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
 CLIP:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2M9 14l2 2 4-4"/></svg>',
 COIN:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5a2.5 2.5 0 00-5 0c0 3 5 2 5 5a2.5 2.5 0 01-5 0M12 6v2M12 16v2"/></svg>',
 FLASK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4 20a1 1 0 001 1h14a1 1 0 001-1L14 9V3"/></svg>',
 DB:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>',
 GEAR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
 CHAT:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 01-8 8H6l-3 3V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg>',
 DL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
};
document.body.innerHTML = document.body.innerHTML.replace(/ICON_([A-Z]+)/g,(m,k)=>I[k]||'');
const LV = {'高':'h','中':'m','低':'l','無紀錄':'n'}; const LC={'高':'#ef4444','中':'#f59e0b','低':'#6b7280','無紀錄':'#d1d5db'};
const dot = l => `<span class="dot ${LV[l]}"></span>${l}`;
const fmt = n => Number(n).toLocaleString();
const kpi = (lab,val,d) => `<div class="card card-b kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="d">${d}</div></div>`;
// ---------- inline SVG charts (three patterns + histogram)
function lineChart(pairs, w=560, h=180, opts={}){const p=28,L=44;const xs=pairs.map(x=>x[0]),ys=pairs.map(x=>x[1]);const mx=Math.max(...ys)*1.1||1;const X=i=>L+(i/(pairs.length-1))*(w-L-p),Y=v=>h-p-(v/mx)*(h-p*2);
 const d=pairs.map((q,i)=>(i?'L':'M')+X(i)+' '+Y(q[1])).join(' ');const area=d+` L${X(pairs.length-1)} ${h-p} L${L} ${h-p} Z`;
 const ticks=[0,0.5,1].map(t=>`<text x="${L-6}" y="${Y(mx*t)+3}" text-anchor="end">${Math.round(mx*t*(opts.pct?100:1))}${opts.pct?'%':''}</text><line x1="${L}" x2="${w-p}" y1="${Y(mx*t)}" y2="${Y(mx*t)}" stroke="#e5e7eb"/>`).join('');
 const xl=pairs.map((q,i)=>i%(opts.every||6)===0?`<text x="${X(i)}" y="${h-p+14}" text-anchor="middle">${q[0]}</text>`:'').join('');
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%">${ticks}<path d="${area}" fill="#e8efea"/><path d="${d}" fill="none" stroke="#2d4a3e" stroke-width="1.5"/>${xl}</svg>`;}
function multiLine(series, labels, w=560, h=200, pct=true){const p=28,L=44;const all=series.flatMap(s=>s.v);const mx=Math.max(...all)*1.1;const n=labels.length;const X=i=>L+(i/(n-1))*(w-L-p),Y=v=>h-p-(v/mx)*(h-p*2);const cols=['#2d4a3e','#8aa399','#d1ddd5','#f59e0b'];
 const g=[0,.5,1].map(t=>`<text x="${L-6}" y="${Y(mx*t)+3}" text-anchor="end">${Math.round(mx*t*(pct?100:1))}${pct?'%':''}</text><line x1="${L}" x2="${w-p}" y1="${Y(mx*t)}" y2="${Y(mx*t)}" stroke="#e5e7eb"/>`).join('');
 const ls=series.map((s,k)=>`<path d="${s.v.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ')}" fill="none" stroke="${cols[k]}" stroke-width="${k?1.2:2}" ${k>1?'stroke-dasharray="3 3"':''}/>`).join('');
 const xl=labels.map((l,i)=>`<text x="${X(i)}" y="${h-p+14}" text-anchor="middle">${l}</text>`).join('');
 const lg=series.map((s,k)=>`<span><i class="sw" style="background:${cols[k]}"></i>${s.name}</span>`).join('');
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%">${g}${ls}${xl}</svg><div class="legend">${lg}</div>`;}
function hbar(items, w=560, opts={}){const mx=Math.max(...items.map(i=>i.v))||1;const rh=22;const h=items.length*rh+8;const L=opts.L||110;
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%">${items.map((it,i)=>`<text x="${L-8}" y="${i*rh+15}" text-anchor="end" style="fill:#0a0a0a">${it.k}</text><rect x="${L}" y="${i*rh+4}" width="${w-L-60}" height="14" fill="#f3f4f6"/><rect x="${L}" y="${i*rh+4}" width="${(it.v/mx)*(w-L-60)}" height="14" fill="${it.c||'#2d4a3e'}"/><text x="${L+(it.v/mx)*(w-L-60)+6}" y="${i*rh+15}">${it.t||it.v}</text>`).join('')}</svg>`;}
function heat(rows, cols, get, w=560){const cw=(w-90)/cols.length, rh=24;const mx=Math.max(...rows.flatMap(r=>cols.map(c=>get(r,c))))||1;const col=v=>v===0?'#fafafa':v<mx*.34?'#d1ddd5':v<mx*.67?'#8aa399':'#2d4a3e';
 return `<svg class="chart" viewBox="0 0 ${w} ${rows.length*rh+24}" width="100%">${cols.map((c,j)=>`<text x="${90+j*cw+cw/2}" y="12" text-anchor="middle">${c}</text>`).join('')}${rows.map((r,i)=>`<text x="82" y="${24+i*rh+15}" text-anchor="end" style="fill:#0a0a0a">${r}</text>`+cols.map((c,j)=>{const v=get(r,c);return `<rect x="${90+j*cw+1}" y="${24+i*rh+1}" width="${cw-2}" height="${rh-2}" fill="${col(v)}"/><text x="${90+j*cw+cw/2}" y="${24+i*rh+15}" text-anchor="middle" style="fill:${v>=mx*.67?'#fff':'#0a0a0a'}">${v||''}</text>`}).join('')).join('')}</svg>`;}
function hist(bins, labels, w=560, h=160, mark=null){const p=26,L=36;const mx=Math.max(...bins)*1.1;const bw=(w-L-p)/bins.length;const Y=v=>h-p-(v/mx)*(h-p*2);
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%">${bins.map((b,i)=>`<rect x="${L+i*bw+4}" y="${Y(b)}" width="${bw-8}" height="${h-p-Y(b)}" fill="${mark===i?'#ef4444':'#2d4a3e'}"/><text x="${L+i*bw+bw/2}" y="${Y(b)-4}" text-anchor="middle">${b}</text><text x="${L+i*bw+bw/2}" y="${h-p+14}" text-anchor="middle">${labels[i]}</text>`).join('')}</svg>`;}
// ---------- app: live screens over /api/v1
const API = '/api/v1';
const S = {}; let CTX = {};
const $ = id => document.getElementById(id);
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600); };
async function api(path, opt = {}) {
  const r = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opt });
  const j = r.headers.get('content-type')?.includes('json') ? await r.json() : null;
  if (!r.ok) { const e = new Error(j?.error?.message || r.statusText); e.code = j?.error?.code; e.hint = j?.error?.hint; e.state = j?.state; e.status = r.status; throw e; }

 <div class="card"><div class="card-h"><h3>AUC 逐年</h3></div><div class="card-b">${multiLine([{ name: '規則', v: get('rule', 'auc') }, { name: 'GBDT', v: get('model', 'auc') }, { name: '按次數', v: get('count', 'auc') }, { name: '按近期', v: get('recency', 'auc') }], yrs.map(String), 560, 200)}<div style="font-size:12px;color:var(--text-muted)">四者都在 0.56–0.70 之間，沒有一個方法穩定領先 → 主張用可解釋的規則。</div></div></div>
</div>
<div class="row c2">
 <div class="card"><div class="card-h"><h3>逐年結果</h3></div><div style="max-height:420px;overflow:auto"><table><thead><tr><th class="num">年</th><th>方法</th><th class="num">觀察點</th><th class="num">正例</th><th class="num">AUC</th><th class="num">前100</th><th class="num">提前天數</th></tr></thead><tbody>${d.by_year.map(b => `<tr><td class="num">${b.obs_year}</td><td>${{ rule: '規則', count: '按次數', recency: '按近期' }[b.baseline] || ref.algo.toUpperCase()}</td><td class="num">${b.n_obs}</td><td class="num">${b.n_pos}</td><td class="num">${b.auc?.toFixed(3)}</td><td class="num">${b.top100?.toFixed(3)}</td><td class="num">${b.lead_days_median ?? ''}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><div class="card-h"><h3>模型版本</h3><span class="chip">單一 active</span></div><table><thead><tr><th class="num">ID</th><th>演算法</th><th class="num">AUC</th><th class="num">前100</th><th>勝過基線</th><th>狀態</th></tr></thead><tbody><tr><td class="num">—</td><td>規則（回頭客燈號）</td><td class="num">${mean(get('rule', 'auc')).toFixed(3)}</td><td class="num">${mean(get('rule', 'top100')).toFixed(3)}</td><td>—</td><td><span class="chip">${d.active ? 'fallback' : 'active'}</span></td></tr>${d.models.map(m => `<tr><td class="num">${m.model_id}</td><td>${m.algo}</td><td class="num">${m.auc?.toFixed(3)}</td><td class="num">${m.top100_cov?.toFixed(3)}</td><td>${m.beats_baseline ? '<span class="dot" style="background:var(--ok)"></span>是' : '<span class="dot l"></span>否'}</td><td><span class="chip">${m.status}</span></td></tr>`).join('')}</tbody></table><div class="note">核准需以 CLI 執行 <span class="mono">python scripts/approve.py &lt;id&gt; --actor 名字</span>，且只在勝過基線時允許。</div></div>
</div>`;
};

// ---------- data quality
S.quality = async () => {
  const d = await api('/data-quality'); const c = d.counts;
  return `
<div class="crumb">維護<span>/</span>資料品質</div><h2>資料品質</h2><p class="sub">資料日期 ${d.data_asof}${d.stale ? ' · <b style="color:var(--warn)">已過期</b>' : ''} · src_ 重建單一交易，app_ 保留</p>
<div class="row c4">${kpi('新北園所', fmt(d.ntpc.n), `座標齊全 ${d.ntpc.coords} · 停辦 ${d.ntpc.inactive}`)}${kpi('裁罰列 → 事件', `${fmt(d.events.rows_)} → ${fmt(d.events.events)}`, '園×日期去重')}${kpi('負責人／法人碼', `${d.linkers.n - d.linkers.ops} / ${d.linkers.ops}`, `${d.linkers.multi} 多園 · ${d.flags.same_name} 同名待確認 · ${d.flags.excluded} 已排除`)}${kpi('財報園年', c.v_ratios, '非營利園決算 OCR')}</div>
<div class="row c2">
 <div class="card"><div class="card-h"><h3>來源與表</h3></div><table><thead><tr><th>來源 / view</th><th class="num">筆數</th></tr></thead><tbody>${Object.entries(c).map(([k, v]) => `<tr><td class="mono">${k}</td><td class="num">${fmt(v)}</td></tr>`).join('')}</tbody></table></div>
 <div class="card"><div class="card-h"><h3>檢查</h3></div><table><tbody>
 <tr><td>座標齊全</td><td class="num">${d.ntpc.coords} / ${d.ntpc.n}</td><td>${d.ntpc.coords === d.ntpc.n ? LAMP.ok : LAMP.warn}</td></tr>
 <tr><td>負責人欄空白（私立／非營利，不掛節點）</td><td class="num">${d.no_owner}</td><td>${LAMP.n}計數</td></tr>
 <tr><td>同名待確認（&gt; 5 km）</td><td class="num">${d.flags.same_name}</td><td>${LAMP.warn}名單不用</td></tr>
 <tr><td>去識別性質測試（回應含姓名 = 0）</td><td class="num">pytest</td><td>${LAMP.ok}REGRESSION</td></tr>
 <tr><td>停辦園</td><td class="num">${d.ntpc.inactive}</td><td>${LAMP.n}不排程</td></tr></tbody></table></div>
</div>
<div class="card"><div class="card-h"><h3>更新紀錄</h3><span class="chip">python scripts/update.py</span></div>${d.runs.length ? `<table><thead><tr><th>時間</th><th>階段</th><th class="num">筆數</th><th class="num">秒</th><th>結果</th><th>訊息</th></tr></thead><tbody>${d.runs.map(r => `<tr><td class="mono">${r.started_at}</td><td>${r.stage}</td><td class="num">${r.n_rows ?? ''}</td><td class="num">${r.seconds ?? ''}</td><td><span class="chip ${r.ok ? '' : 'err'}">${r.ok ? 'ok' : 'fail'}</span></td><td style="font-size:12px;color:var(--text-muted)">${esc(r.message || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="card-b" style="color:var(--text-muted)">尚無管線紀錄；在終端執行 <span class="mono">python scripts/update.py</span> 會寫入此表。</div>'}</div>`;
};

// ---------- settings
S.settings = async () => {
  const d = await api('/settings'); const s = d.settings;
  const f = (k, label) => `<label>${label} <input class="inp mono" name="${k}" value="${s[k]}"></label>`;
  const cap = +s.n_inspectors * +s.visits_per_inspector_week * +s.quarter_weeks;
  return `
<div class="crumb">維護<span>/</span>設定</div><h2>設定</h2><p class="sub">人力是系統內約束；改了就影響排程與產能圖</p>
<form onsubmit="return saveSettings(event)">
<div class="row c2">
 <div class="card"><div class="card-h"><h3>稽查人力</h3></div><div class="card-b" style="display:grid;gap:12px">${f('n_inspectors', '稽查員人數')}${f('visits_per_inspector_week', '每人每週訪視次數')}${f('quarter_weeks', '本季週數')}<div style="font-size:12px;color:var(--text-muted)">目前本季產能 = <b class="mono">${cap}</b> 次</div></div></div>
 <div class="card"><div class="card-h"><h3>門檻與觀察期</h3></div><div class="card-b" style="display:grid;gap:12px">${f('high_threshold', '高風險門檻（12 個月再犯率）')}${f('mid_threshold', '中風險門檻')}${f('top_n_default', '前 N 預設')}${f('watch_window_months', '名單觀察期（月）')}${f('stale_days', '資料過期警示（天）')}</div></div>
</div>
<div class="row c2">
 <div class="card"><div class="card-h"><h3>個資</h3></div><div class="card-b"><div>負責人／行為人姓名：<span class="chip">架構層不出</span></div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">API 與問答只讀 v_* view，無姓名欄；園名為公開登記名稱。</div></div></div>
 <div class="card"><div class="card-h"><h3>問答</h3></div><div class="card-b"><div>ANTHROPIC_API_KEY <span class="chip">${d.agent_enabled ? '已設定' : '未設定'}</span></div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">${d.agent_enabled ? '工具集只讀 v_* view，無寫入工具，每輪留痕 app_agent_turns。' : '未設定時抽屜停用；在 .env 設定後重啟。'}</div></div></div>
</div>
<div class="tools" style="justify-content:flex-end"><button class="btn pri" type="submit">儲存（門檻變更會重新評分，排程標記過期）</button></div></form>`;
};
async function saveSettings(e) { e.preventDefault(); const body = {}; for (const [k, v] of new FormData(e.target)) body[k] = v; try { const r = await api('/settings', { method: 'PUT', body: JSON.stringify(body) }); toast('已儲存' + (r.rescored ? `，重新評分：高 ${r.rescored['高'] || 0}／中 ${r.rescored['中'] || 0}` : '')); show(); } catch (er) { toast(er.message); } return false; }

// ---------- export / ask / shell
function openExport(scope) { $('modal').classList.add('open'); $('exscope').value = scope; updExport(); }
function updExport() { const sc = $('exscope').value, fm = $('exfmt').value; let q = `scope=${sc}&format=${fm}`; if (sc === 'rankings') { const p = new URLSearchParams(location.hash.split('?')[1] || ''); if (p.get('town')) q += '&town=' + p.get('town'); if (p.get('level')) q += '&level=' + p.get('level'); q += '&top_n=' + (CTX.rank?.thresholds?.top_n || 100); } $('exgo').href = API + '/export?' + q; }
$('exscope').onchange = updExport; $('exfmt').onchange = updExport;
const SUGG = { overview: ['近一年哪個區的裁罰事件最多？', '高風險園裡有幾家是非營利？'], rank: ['排名第一的園為什麼是它？', '板橋區近 12 個月被罰兩次以上的園有哪些？'], schedule: ['第 1 週三位稽查員各排了哪些園？', '本季排程覆蓋了幾家高風險園？'], season: ['本季名單裡哪些園同負責人？', '連坐待確認的園來源是哪幾家？'], finance: ['人事費率最高的非營利園是哪家？'], backtest: ['回測最差的是哪一年？'] };
async function askSubmit(e) { e.preventDefault(); const q = $('askq').value.trim(); if (!q) return false; $('askq').value = ''; const box = $('chat'); box.insertAdjacentHTML('beforeend', `<div class="msg u">${esc(q)}</div><div class="msg a" id="pending">查詢中…</div>`); box.scrollTop = box.scrollHeight; try { const r = await api('/ask', { method: 'POST', body: JSON.stringify({ question: q, page: location.hash }) }); $('pending').outerHTML = `<div class="msg a">${esc(r.answer).replace(/\n/g, '<br>')}<span class="tool">${r.tool_calls.map(c => c.tool + (c.n != null ? ` · ${c.n} 列` : '')).join(' → ') || '無工具'} · ${(r.latency_ms / 1000).toFixed(1)}s</span></div>`; } catch (er) { $('pending').outerHTML = `<div class="msg a" style="color:var(--err)">${esc(er.message)}${er.hint ? '：' + esc(er.hint) : ''}</div>`; } box.scrollTop = box.scrollHeight; return false; }
function renderSugg(k) { $('sugg').innerHTML = (SUGG[k] || SUGG.overview).map(s => `<span class="chip" onclick="$('askq').value=this.textContent;$('askform').requestSubmit()">${s}</span>`).join(''); }
async function show() {
  const h = (location.hash || '#overview').slice(1); const [path, q] = h.split('?'); const [k, arg] = path.split('/');
  const f = S[k] || S.overview; const main = $('main'); main.innerHTML = '<div class="skel">載入中…</div>';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.s === k || (k === 'detail' && a.dataset.s === 'rank') || (k === 'linker' && a.dataset.s === 'rank')));
  try { if (k === 'detail' && !CTX.rank) { try { CTX.rank = await api('/rankings?size=1'); } catch (_) { } } main.innerHTML = await f(arg || q); if (k === 'overview') initMap(); window.scrollTo(0, 0); }
  catch (e) { main.innerHTML = `<h2>${k}</h2>${errCard(e)}${e.state === 'no_scores' ? '<div class="note">執行 <span class="mono">make bootstrap</span> 或 <span class="mono">python scripts/score.py</span></div>' : ''}`; }
  renderSugg(k);
}
async function boot() { try { const h = await api('/health'); const s = await api('/settings'); $('foot').innerHTML = `資料日期 <span class="mono">${s.settings.data_asof || '—'}</span><br>園名＝公開登記名稱<br>負責人／行為人姓名不顯示`; $('askstate').textContent = h.agent ? '只讀 v_* view · 無寫入工具 · 每輪留痕' : '未設定 ANTHROPIC_API_KEY，問答停用；其餘功能不受影響'; if (!h.agent) { $('askq').disabled = true; } } catch (e) { $('foot').textContent = '無法連線 API'; } show(); }
window.addEventListener('hashchange', show); boot();

</script>
</body></html>
